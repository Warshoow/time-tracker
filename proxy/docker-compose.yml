services:
  jira-proxy:
    build: .
    container_name: time-tracker-jira-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://warshoow.github.io}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
